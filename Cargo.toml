[package]
name = "kvm-share"
version = "0.2.0"
edition = "2021"
description = "Keyboard, mouse & clipboard sharing — no terminal, no lag, no dependencies"

[dependencies]
# ── Async runtime ─────────────────────────────────────────────────────────────
tokio = { version = "1", features = ["full"] }

# ── Input capture (rdev::grab intercepts events before the OS sees them) ──────
# `serialize` feature enables serde on Key / Button / EventType
rdev = { version = "0.5", features = ["serialize", "unstable_grab"] }

# ── Input injection (send keyboard/mouse events to the OS) ───────────────────
enigo = "0.2"

# ── Clipboard ─────────────────────────────────────────────────────────────────
arboard = "3"

# ── System tray ───────────────────────────────────────────────────────────────
tray-icon = "0.19"

# ── Protocol serialization — compact binary, ~5-10 bytes per event ───────────
bincode = "1"
serde = { version = "1", features = ["derive"] }

# ── Config file (human-readable JSON on disk) ────────────────────────────────
serde_json = "1"

# ── Config directory (~/.config/kvm-share/) ──────────────────────────────────
dirs = "5"

# ── Icon ─────────────────────────────────────────────────────────────────────
image = { version = "0.25", default-features = false, features = ["png"] }

# ── Logging ──────────────────────────────────────────────────────────────────
log = { version = "0.4", features = ["std"] }

# ── Pairing + packet signing (see crypto.rs) ─────────────────────────────────
# Audited primitives instead of hand-rolled ones. Randomness and at-rest key
# protection come from Windows (BCryptGenRandom, DPAPI) via windows-sys.
x25519-dalek = { version = "2", features = ["static_secrets"] }
hmac = "0.12"
sha2 = "0.10"

# ── Linux: GTK event loop required for tray-icon ─────────────────────────────
[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18" }

# ── Windows: Win32 message pump, Raw Input API ───────────────────────────────
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    "Win32_UI_Input",
    "Win32_System_LibraryLoader",
    "Win32_Graphics_Gdi",
    "Win32_Security_Cryptography",
] }

[[bin]]
name = "kvm-share"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
strip = true
